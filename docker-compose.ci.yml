# CI-only storage override.
#
# The dev stack uses MinIO, which is the right thing to run beside a
# production deployment. Its images, though, are no longer anonymously
# pullable: Docker Hub's minio/minio and minio/mc were withdrawn, and the
# quay.io repositories the compose file moved to now answer `unauthorized`
# for the pinned release tags. A GitHub runner has no credentials for either,
# so the acceptance job has failed at `docker compose up` since 2026-09-24.
#
# Rather than put registry credentials in CI, the acceptance job swaps the
# object store for LocalStack's S3, which is anonymously pullable and, more
# importantly for what the acceptance script asserts, still refuses an
# unsigned request for a private object.
#
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml \
#     up -d --build postgres redis localstack storage-init api worker
#
# Nothing here changes the dev or production stacks.
services:
  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
      DEBUG: "0"
      EAGER_SERVICE_LOADING: "1"
      PERSISTENCE: "0"
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the bucket and grants anonymous read to exactly the two prefixes
  # MinIO's `mc anonymous set download` grants it to in the dev stack.
  # progress-photos/ is deliberately not among them: the acceptance run checks
  # that an unsigned request for a progress photo is refused.
  storage-init:
    image: amazon/aws-cli:2.17.0
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-fittrack}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-fittrack-dev-secret}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        endpoint=http://localstack:4566
        bucket=${S3_BUCKET:-fittrack}
        # Idempotent, so a re-run against a surviving volume is not a failure.
        aws --endpoint-url "$$endpoint" s3api create-bucket --bucket "$$bucket" \
          2>/dev/null || true
        aws --endpoint-url "$$endpoint" s3api put-bucket-policy --bucket "$$bucket" --policy "{
          \"Version\": \"2012-10-17\",
          \"Statement\": [
            {
              \"Effect\": \"Allow\",
              \"Principal\": \"*\",
              \"Action\": \"s3:GetObject\",
              \"Resource\": [
                \"arn:aws:s3:::$$bucket/exercise-media/*\",
                \"arn:aws:s3:::$$bucket/avatars/*\"
              ]
            }
          ]
        }"
        echo 'Bucket ready.'
    restart: "no"

  api:
    environment:
      S3_ENDPOINT: http://localstack:4566
      # Presigned URLs are signed for the host the client will use, and the
      # acceptance script runs on the host rather than inside the network.
      S3_PUBLIC_ENDPOINT: http://localhost:4566
    # `!override` rather than a plain mapping: compose merges depends_on, so
    # without it the base file's dependency on minio survives and compose
    # starts the very service this file exists to avoid.
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  worker:
    environment:
      S3_ENDPOINT: http://localstack:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
